<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- DEMO ONLY: remove the robots meta at launch (the demo footer line comes from data/site.js) -->
<meta name="robots" content="noindex">
<title>Chào XO Kitchen | Asian Comfort Food in National City</title>
<meta name="description" content="Chào XO Kitchen serves Asian comfort food like pho, birria dumplings and ube drinks on E Plaza Blvd in National City, CA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<!-- Content comes from data/site.js; js/render.js fills the page, js/main.js adds behavior. -->
<script src="data/site.js" defer></script>
<script src="js/render.js" defer></script>
<script src="js/main.js" defer></script>
</head>
<body>

<div class="infobar" id="infobar">
  <span id="infobar-hours" hidden></span>
  <a data-directions href="#" data-track="directions">📍 <span id="infobar-addr"></span></a>
  <a data-tel data-tel-label="📞 " href="#" data-track="call"></a>
</div>

<header class="hero" id="home">
  <img id="hero-img" src="" alt="">
  <div class="wrap nav">
    <a class="logo" href="#home" data-text="business.name"></a>
    <nav class="nav-links" aria-label="Main">
      <a href="#home" aria-current="page">Home</a>
      <a href="#menu">Menu</a>
      <a href="#order">Order</a>
      <a href="#reviews">Reviews</a>
      <a href="#visit">Visit</a>
    </nav>
    <a class="btn btn-accent" id="order-btn" href="#menu" data-track="order">Order Online</a>
  </div>
  <div class="wrap">
    <div class="hero-body">
      <span class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></span>
      <h1 data-text="hero.headline"></h1>
      <p id="hero-sub"></p>
      <div class="hero-ctas">
        <a class="btn btn-accent" href="#menu" data-track="menu">View Our Menu</a>
        <a class="btn btn-white" data-tel href="#" data-track="call">Call Now</a>
      </div>
      <div class="also" id="also" hidden><span>Also on:</span></div>
    </div>
  </div>
</header>

<ul class="amenities wrap" id="amenities" aria-label="What to expect"></ul>

<main>
  <section class="block wrap" id="menu" aria-labelledby="menu-title">
    <div class="head">
      <h2 id="menu-title">Our menu</h2>
      <div class="tabs" id="menu-tabs" role="tablist" aria-label="Menu categories"></div>
    </div>
    <div id="menu-panels"></div>
    <p class="menu-note" id="menu-note"></p>
  </section>

  <section class="block wrap" id="order" aria-labelledby="order-title">
    <h2 id="order-title">Ways to order</h2>
    <div class="order-grid" id="order-options"></div>
  </section>

  <section class="block wrap" id="reviews" aria-labelledby="reviews-title">
    <div class="head">
      <h2 id="reviews-title">What people say</h2>
      <span class="rating" id="rating"></span>
    </div>
    <div class="reviews" id="review-list"></div>
  </section>

  <section class="block wrap visit" id="visit" aria-labelledby="visit-title">
    <div class="card">
      <h2 id="visit-title">Hours</h2>
      <ul class="hours" id="hours"></ul>
      <address class="addr" id="addr"></address>
      <a class="link" data-directions href="#" data-track="directions">Get directions →</a>
    </div>
    <iframe class="map" id="map" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </section>

  <section class="block wrap story" id="story" aria-labelledby="story-title">
    <div class="story-photo"><img id="story-img" src="" alt="" loading="lazy"></div>
    <div>
      <div class="eyebrow">OUR STORY</div>
      <h2 id="story-title"></h2>
      <div id="story-text"></div>
      <div class="tags" id="story-tags"></div>
      <p class="catering" id="catering" hidden></p>
      <a class="btn btn-dark" data-tel data-tel-label="Call us: " href="#" data-track="call"></a>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div class="foot">
      <div>
        <a class="logo" href="#home" data-text="business.name"></a>
        <address class="foot-addr" id="foot-addr"></address>
      </div>
      <div>
        <div><a data-tel href="#" data-track="call"></a></div>
        <div><a data-directions href="#" data-track="directions">Get directions</a></div>
      </div>
    </div>
    <p class="demo-line" id="demo-line" hidden>Demo by Mainstreet Sites SD</p>
  </div>
</footer>

<div class="callbar">
  <a class="btn btn-accent" data-tel href="#" data-track="call">Call Now</a>
  <a class="btn btn-dark" data-directions href="#" data-track="directions">Directions</a>
</div>

<noscript><p class="wrap">This site needs JavaScript to show the menu and hours. Call us or visit 1420 E Plaza Blvd Ste D-05, National City.</p></noscript>
</body>
</html>
